# Bekor local development stack. DEVELOPMENT ONLY — not a deployment artifact.
#
#   Default (no profile):  postgres, migrate, api
#   --profile worker:      + judging worker against an EXTERNAL private Judge0 (set JUDGE0_URL in .env)
#   --profile runner:      + judging worker + bundled Judge0 (server, workers, its own postgres/redis)
#
# Examples (run from the repository root, with a filled-in .env):
#   podman compose -f infra/compose/compose.yaml --env-file .env up -d
#   podman compose -f infra/compose/compose.yaml --env-file .env --profile runner up -d
#
# The worker is profile-gated because it refuses to start without a JUDGE0_URL; the API still
# accepts submissions without it and they stay `queued` until a worker runs (recovery requeues them).
#
# Runner profile requirements (see docs/decisions/runner.md and docs/verification/f03-runner.md):
#   Judge0 1.13.1 uses isolate with cgroup v1 and must run `privileged`. It does NOT work on a
#   cgroup-v2-only host or under rootless Podman (verified failure on the Fedora dev host). Use a
#   rootful Docker/Podman engine on a dedicated VM booted with `systemd.unified_cgroup_hierarchy=0`.
#   Never run the runner profile on a machine that also holds production secrets.
#
# Networks: `app` carries postgres/api/worker traffic. `runner` is internal (no egress) and only the
# worker joins both, so the API cannot reach Judge0 and learner code has no route to the app DB.

name: bekor

x-app: &app
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
  image: localhost/bekor-dev:latest
  init: true
  networks: [app]

services:
  postgres:
    image: docker.io/library/postgres:17.11-alpine
    environment:
      POSTGRES_USER: bekor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bekor}
      POSTGRES_DB: bekor
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bekor -d bekor"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://bekor:${POSTGRES_PASSWORD:-bekor}@postgres:5432/bekor
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["pnpm", "--filter", "@bekor/api", "exec", "tsx", "src/main.ts"]
    environment:
      NODE_ENV: development
      PORT: "3000"
      API_ORIGIN: ${API_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://bekor:${POSTGRES_PASSWORD:-bekor}@postgres:5432/bekor
      # Intentionally no default: the API must fail clearly when the secret is missing.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *app
    profiles: [worker, runner]
    command: ["pnpm", "--filter", "@bekor/worker", "exec", "tsx", "src/main.ts"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bekor:${POSTGRES_PASSWORD:-bekor}@postgres:5432/bekor
      # Defaults to the bundled runner (runner profile); override in .env for an external one.
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0-server:2358/}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      WORKER_HEALTH_PORT: "3001"
      WORKER_HEALTH_HOST: 127.0.0.1
    networks: [app, runner]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Graceful drain: pg-boss stop waits up to 160 s for the in-flight submission.
    stop_grace_period: 170s
    restart: unless-stopped

  judge0-server:
    profiles: [runner]
    build:
      context: judge0
      dockerfile: Dockerfile
    image: localhost/bekor-judge0:1.13.1-node24.22.1-ts7.0.2
    # Upstream Judge0 1.13.1 compose runs both server and workers privileged.
    privileged: true
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    environment: &judge0-env
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-bekor-judge0-dev-redis}
      POSTGRES_HOST: judge0-postgres
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-bekor-judge0-dev-postgres}
      AUTHN_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS -H "X-Auth-Token: $$AUTHN_TOKEN" http://127.0.0.1:2358/about']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      judge0-postgres:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    networks: [runner]
    restart: unless-stopped

  judge0-workers:
    profiles: [runner]
    image: localhost/bekor-judge0:1.13.1-node24.22.1-ts7.0.2
    command: ["./scripts/workers"]
    privileged: true
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    environment: *judge0-env
    depends_on:
      judge0-server:
        condition: service_started
    networks: [runner]
    restart: unless-stopped

  judge0-postgres:
    profiles: [runner]
    image: docker.io/library/postgres:16.4
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-bekor-judge0-dev-postgres}
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [runner]

  judge0-redis:
    profiles: [runner]
    image: docker.io/library/redis:7.2.4
    command: ["sh", "-c", 'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-bekor-judge0-dev-redis}
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [runner]

networks:
  app: {}
  runner:
    # No external route: Judge0 and learner code cannot reach the internet or the app network.
    internal: true

volumes:
  postgres-data: {}
  judge0-postgres-data: {}
