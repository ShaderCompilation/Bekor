# Non-secret Judge0 1.13.1 settings for Bekor development. This file is `source`d by Judge0 and
# overrides environment variables, so secrets (REDIS_PASSWORD, POSTGRES_PASSWORD, AUTHN_TOKEN) and
# hostnames are deliberately NOT set here; compose.yaml passes them as environment.

JUDGE0_TELEMETRY_ENABLE=false
RAILS_ENV=production

# Bekor polls (wait=false) and uploads a multi-file archive per case.
ENABLE_WAIT_RESULT=false
ENABLE_ADDITIONAL_FILES=true
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_CALLBACKS=false
ENABLE_BATCHED_SUBMISSIONS=false
ENABLE_SUBMISSION_DELETE=false
USE_DOCS_AS_HOMEPAGE=false

# Learner code never gets network access, regardless of what a request asks for.
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# Server-side ceilings at/above Bekor's policy in packages/runner/src/harness.ts (validateRequest).
CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=2
CPU_EXTRA_TIME=0
MAX_CPU_EXTRA_TIME=0
WALL_TIME_LIMIT=6
MAX_WALL_TIME_LIMIT=6
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=262144
MAX_PROCESSES_AND_OR_THREADS=32
MAX_MAX_PROCESSES_AND_OR_THREADS=32
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=32
MAX_MAX_FILE_SIZE=64
NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=1
REDIRECT_STDERR_TO_STDOUT=false

MAX_QUEUE_SIZE=200
COUNT=2
